# Copy to <config>/projects/api-stack.toml, then:
#   export VANTAGE_PROJECTS_DIR=~/projects   (or projects_dir in <config>/config.toml)
#   vantage project sync api-stack
name = "api-stack"           # defaults to the file name

[[repo]]
url = "git@example.invalid:org/api.git"
copy = [".env", ".env.local"] # untracked files task worktrees will need

[[repo]]
url = "https://example.invalid/org/web.git"
dir = "frontend"             # clone directory; defaults to the repo name
