# vantage split picker. Source from tmux.conf:
#   source-file -q ~/.config/tmux/vantage.conf
#
# prefix S / V split stacked / side by side and ask: local shell or ssh host.
# Plain s / v (if you bind them) stay local. Needs `vantage` on PATH.
# For a non-default tmux socket add: --socket NAME (or export VANTAGE_SOCKET).
# tmux expands #{...} in run-shell but not in display-popup's command or -e, so
# run-shell fills in the pane id and cwd, then opens the popup. On failure the
# popup waits for Enter so the error stays readable.
bind S run-shell "tmux display-popup -E -w 78 -h 16 -T ' split: stacked ' \"vantage pick --split v --pane '#{pane_id}' --cwd '#{pane_current_path}' || { echo; echo failed, press Enter; read _; }\""
bind V run-shell "tmux display-popup -E -w 78 -h 16 -T ' split: side by side ' \"vantage pick --split h --pane '#{pane_id}' --cwd '#{pane_current_path}' || { echo; echo failed, press Enter; read _; }\""

# prefix T names the pane. It replaces tmux's own "set pane title" key. The
# name is typed into vantage (not tmux's prompt), so it never passes through a
# shell. Empty name = the border follows the running command again.
bind T run-shell "tmux display-popup -E -w 60 -h 6 -T ' pane name ' \"vantage rename-pane --pane '#{pane_id}' || { echo; echo failed, press Enter; read _; }\""
