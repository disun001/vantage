# vantage split picker. Source from tmux.conf:
#   source-file -q ~/.config/tmux/vantage.conf
#
# prefix S / V split stacked / side by side and ask: local shell or ssh host.
# Plain s / v (if you bind them) stay local. Needs `vantage` on PATH.
# For a non-default tmux socket add: --socket NAME (or export VANTAGE_SOCKET).
# tmux expands #{...} in run-shell but not in display-popup's command or -e, so
# run-shell fills in the pane id and cwd, then opens the popup. On failure the
# popup waits for Enter so the error stays readable.
bind S run-shell "tmux display-popup -E -w 50% -h 50% -T ' split: stacked ' \"vantage pick --split v --pane '#{pane_id}' --cwd '#{pane_current_path}' || { echo; echo failed, press Enter; read _; }\""
bind V run-shell "tmux display-popup -E -w 50% -h 50% -T ' split: side by side ' \"vantage pick --split h --pane '#{pane_id}' --cwd '#{pane_current_path}' || { echo; echo failed, press Enter; read _; }\""
